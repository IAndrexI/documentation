site_name: Protutech Engineering Docs
site_description: Deep architectural breakdowns, system topologies, and service workflows for the Protutech ecosystem.
site_author: Andrew (IAndrexI)
site_url: https://docs.protutech.vip
repo_name: IAndrexI/documentation
repo_url: https://github.com/IAndrexI/documentation
copyright: "Copyright &copy; 2026 Andrew (Protutech)"

# Custom Portfolio Theme Overrides
extra_css:
  - stylesheets/extra.css

# Theme Configuration
theme:
  name: material
  language: en
  favicon: assets/protutech-logo.svg
  logo: assets/protutech-logo.svg
  palette:
    # Default to Obsidian Dark Mode with Cyan accents
    - scheme: slate
      primary: cyan
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: cyan
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.instant        # SPA instant page transitions
    - navigation.tracking       # URL updates with scroll position
    - navigation.tabs           # Top-level navigation tabs
    - navigation.tabs.sticky    # Keep tabs visible while scrolling
    - navigation.sections       # Expandable navigation sections
    - navigation.expand         # Auto-expand sections
    - navigation.top            # Back to top floating pill
    - navigation.footer         # Next/previous page footer
    - search.suggest            # Search auto-completion
    - search.highlight          # Highlight matching words
    - search.share              # Shareable search links
    - content.code.copy         # One-click code copy button
    - content.code.annotate     # Clickable interactive annotations in code
    - content.tabs.link         # Synchronize tabs across all pages

# Markdown Extensions (Mermaid, Tabs, Callouts, Code Blocks)
markdown_extensions:
  - admonition                  # Callout boxes (note, warning, tip)
  - attr_list                   # CSS attribute tags
  - md_in_html                  # Inline HTML rendering
  - tables                      # Markdown tables
  - footnotes
  - pymdownx.details            # Collapsible callout boxes (??? note)
  - pymdownx.superfences:       # Interactive Mermaid diagrams
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:         # Code syntax highlighting
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite       # Inline code highlighting
  - pymdownx.tabbed:            # Multi-language code tabs
      alternate_style: true
  - pymdownx.tasklist:          # Checklist support
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

