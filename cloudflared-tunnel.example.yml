# ==============================================================================
# Cloudflare Zero Trust Tunnel Ingress Rule Example (cloudflared)
# ==============================================================================
# Add this entry to your Proxmox / Homelab Cloudflare Tunnel configuration:
# ==============================================================================

tunnel: your-tunnel-id-here
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # Protutech Engineering Documentation Portal
  - hostname: docs.protutech.vip
    service: http://localhost:8085   # or internal LXC IP e.g. http://192.168.0.110:80

  # Existing services
  - hostname: dash.protutech.vip
    service: http://localhost:8080

  - hostname: cs2.protutech.vip
    service: http://localhost:3000

  - service: http_status:404
