<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Neon Cyan & Violet Glow Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>

    <linearGradient id="glowViolet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="badgeOutline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Hex Shield Container -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="url(#badgeOutline)" stroke-width="4" />

  <!-- Outer Tech Hexagon Ring -->
  <polygon points="256,64 420,158 420,354 256,448 92,354 92,158" 
           fill="none" stroke="url(#cyanPurple)" stroke-width="8" stroke-dasharray="16,8" opacity="0.4" />

  <!-- Core "P" & "T" Interlocking Geometric Emblem -->
  <!-- Tech Stem (P & T shared axis) -->
  <path d="M168,140 L260,140 C320,140 356,172 356,224 C356,276 316,308 260,308 L224,308 L224,390 L168,390 Z" 
        fill="url(#cyanPurple)" filter="url(#neonGlow)" />
  
  <!-- Counter cutout of "P" -->
  <path d="M224,196 L254,196 C282,196 298,208 298,224 C298,240 282,252 254,252 L224,252 Z" 
        fill="#0b101d" />

  <!-- The "T" Cross-bar & Dynamic Wings -->
  <path d="M210,140 L394,140 L382,188 L278,188 L278,390 L224,390 L224,188 L210,188 Z" 
        fill="url(#glowViolet)" opacity="0.85" filter="url(#neonGlow)" />

  <!-- High-Tech Circuit Accent Dots -->
  <circle cx="394" cy="140" r="10" fill="#00f2fe" filter="url(#neonGlow)" />
  <circle cx="278" cy="390" r="9" fill="#a855f7" filter="url(#neonGlow)" />
  <circle cx="168" cy="390" r="9" fill="#00f2fe" filter="url(#neonGlow)" />
  <circle cx="356" cy="224" r="8" fill="#ec4899" filter="url(#neonGlow)" />

  <!-- Tech Grid Coordinate Nodes -->
  <line x1="92" y1="256" x2="140" y2="256" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <line x1="372" y1="256" x2="420" y2="256" stroke="#c084fc" stroke-width="4" stroke-linecap="round" opacity="0.6" />
</svg>
